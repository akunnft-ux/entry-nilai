<!DOCTYPE html>

<link rel="stylesheet" href="css/base.css">

<a class="skip-link" href="#view">Lewati ke konten</a>

<header class="app-header" id="appHeader" hidden>
  <div class="wrap header-inner">
    <a class="brand" href="#/entry">
      <span class="brand-mark" aria-hidden="true">N</span>
      <span class="brand-name">Entry Nilai</span>
    </a>

    <nav class="nav" id="mainNav" aria-label="Navigasi utama">

      </span>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" type="button">Keluar</button>
    </div>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<div id="toastRoot" class="toast-root" role="status" aria-live="polite" aria-label="Notifikasi"></div>
